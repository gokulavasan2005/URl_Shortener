<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link Expired | Gokul URL Shortener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #07070e;
      font-family: 'Outfit', 'Inter', sans-serif;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow-x: hidden;
      position: relative;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #f59e0b, transparent 70%);
      top: -150px; left: -150px;
    }
    body::after {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #ef4444, transparent 70%);
      bottom: -100px; right: -100px;
    }

    .glass-card {
      position: relative;
      z-index: 1;
      max-width: 580px;
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 28px;
      padding: 3rem 2.25rem;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 35px rgba(245, 158, 11, 0.2);
    }

    .img-3d-wrapper {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 0 auto 1.5rem;
    }

    .img-3d-glow {
      position: absolute;
      inset: -10px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.5), transparent 70%);
      filter: blur(20px);
    }

    .img-3d {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
      animation: float 5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .status-code {
      font-size: clamp(4.5rem, 15vw, 7rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #fbbf24, #f87171);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -2px;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 0.75rem;
    }

    p {
      color: #94a3b8;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .info-card {
      background: rgba(245,158,11,0.08);
      border: 1px solid rgba(245,158,11,0.25);
      border-radius: 14px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.75rem;
      text-align: left;
    }

    .info-card label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #fbbf24;
      margin-bottom: 0.25rem;
      font-weight: 700;
    }

    .info-card .value {
      font-size: 0.92rem;
      color: #f8fafc;
      word-break: break-all;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem 1.85rem;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      margin-top: 1rem;
      transition: all 0.25s ease;
      background: linear-gradient(135deg, #7c3aed, #0891b2);
      color: white;
      border: none;
      box-shadow: 0 4px 20px rgba(124,58,237,0.4);
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(124,58,237,0.6);
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <div class="img-3d-wrapper">
      <div class="img-3d-glow"></div>
      <img src="/static/images/hero_3d.png" alt="3D Hourglass Expired Link" class="img-3d" />
    </div>

    <div class="status-code">410</div>
    <h1>This Link Has Expired</h1>
    <p>
      The short link <strong style="color:#fbbf24;">/{{ short_code }}</strong> has passed its expiration time limit.
    </p>

    <div class="info-card">
      <label>Original Destination URL</label>
      <div class="value">{{ original_url }}</div>
    </div>

    <div class="info-card">
      <label>Expired On</label>
      <div class="value">{{ expires_at }}</div>
    </div>

    <a href="/" class="btn">
      ⚡ Shorten a New Link
    </a>
  </div>
</body>
</html>
