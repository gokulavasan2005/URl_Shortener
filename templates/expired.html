<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link Expired | SnapURL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0a0a0f;
      font-family: 'Inter', sans-serif;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 500px; height: 500px;
      background: #f59e0b;
      top: -150px; left: -150px;
    }
    body::after {
      width: 400px; height: 400px;
      background: #ef4444;
      bottom: -100px; right: -100px;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 580px;
    }

    .emoji { font-size: 5rem; margin-bottom: 1rem; display: block; }

    .status-code {
      font-size: clamp(5rem, 18vw, 8rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -3px;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 1rem;
    }

    p {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }

    .info-card {
      background: rgba(245,158,11,0.08);
      border: 1px solid rgba(245,158,11,0.2);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin: 1.5rem 0;
      text-align: left;
    }

    .info-card label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #f59e0b;
      margin-bottom: 0.25rem;
      font-weight: 600;
    }

    .info-card .value {
      font-size: 0.9rem;
      color: #e2e8f0;
      word-break: break-all;
    }

    .info-card + .info-card { margin-top: -0.5rem; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.75rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #0891b2);
      color: white;
      border: none;
      box-shadow: 0 4px 24px rgba(124,58,237,0.4);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(124,58,237,0.55);
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="emoji">⏰</span>
    <div class="status-code">410</div>
    <h1>This Link Has Expired</h1>
    <p>
      The short link <strong>/{{ short_code }}</strong> existed but its expiry date
      has passed. The destination URL is shown below for reference.
    </p>

    <div class="info-card">
      <label>Original Destination</label>
      <div class="value">{{ original_url }}</div>
    </div>

    <div class="info-card" style="margin-top:0.5rem;">
      <label>Expired On</label>
      <div class="value">{{ expires_at }}</div>
    </div>

    <br />
    <a href="/" class="btn btn-primary">
      ⚡ Create a New Link
    </a>
  </div>
</body>
</html>
