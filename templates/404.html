<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Link Not Found | Gokul URL Shortener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #07070e;
      font-family: 'Outfit', 'Inter', sans-serif;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated background glow orbs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.2;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 550px; height: 550px;
      background: radial-gradient(circle, #7c3aed, transparent 70%);
      top: -150px; left: -150px;
    }
    body::after {
      width: 450px; height: 450px;
      background: radial-gradient(circle, #06b6d4, transparent 70%);
      bottom: -100px; right: -100px;
    }

    .glass-card {
      position: relative;
      z-index: 1;
      max-width: 580px;
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 28px;
      padding: 3rem 2.25rem;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 35px rgba(124, 58, 237, 0.2);
    }

    .img-3d-wrapper {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto 1.5rem;
    }

    .img-3d-glow {
      position: absolute;
      inset: -10px;
      background: radial-gradient(circle, rgba(124,58,237,0.5), transparent 70%);
      filter: blur(20px);
    }

    .img-3d {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
      animation: float 5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .error-code {
      font-size: clamp(5rem, 16vw, 7.5rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #c084fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -2px;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 0.75rem;
    }

    p {
      color: #94a3b8;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2.25rem;
    }

    .code-badge {
      display: inline-block;
      background: rgba(124,58,237,0.18);
      border: 1px solid rgba(124,58,237,0.4);
      border-radius: 8px;
      padding: 0.2rem 0.7rem;
      font-family: monospace;
      font-size: 0.95rem;
      color: #c084fc;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.85rem;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #0891b2);
      color: white;
      border: none;
      box-shadow: 0 4px 20px rgba(124,58,237,0.4);
    }
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(124,58,237,0.6);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: #94a3b8;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.1);
      color: #f8fafc;
      transform: translateY(-3px);
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <div class="img-3d-wrapper">
      <div class="img-3d-glow"></div>
      <img src="/static/images/hero_3d.png" alt="3D Lost Portal" class="img-3d" />
    </div>
    
    <div class="error-code">404</div>
    <h1>Short Link Not Found</h1>
    
    {% if short_code %}
    <p>
      The short link <span class="code-badge">/{{ short_code }}</span> doesn't exist or may have been removed. Double-check the code or shorten a new URL.
    </p>
    {% else %}
    <p>
      The page or link you requested could not be located on the server.
    </p>
    {% endif %}
    
    <div class="btn-group">
      <a href="/" class="btn btn-primary">
        ⚡ Shorten a New Link
      </a>
      <a href="javascript:history.back()" class="btn btn-secondary">
        ← Go Back
      </a>
    </div>
  </div>
</body>
</html>
